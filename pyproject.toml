[project]
name = "pareto"
version = "0.0.1"
description = "Cost-optimized, open-source RAG infrastructure"
authors = [{name = "Latif Şimşek", email = "latifsimsek314@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["rag", "llm", "retrieval-augmented-generation", "vector-search", "ai-infrastructure"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "graphviz>=0.20",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]

[project.scripts]
pareto = "pareto.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/Engineer-coding/pareto"
Repository = "https://github.com/Engineer-coding/pareto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pareto"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]