# Pareto benchmark test set — Week 6 expanded (corpus scale-up).
# Ground truth is source-based (filename substrings) + keyword-based (lowercase
# substring match in the generated answer).
#
# 45 queries across 3 domains (15 each). 10 NO_ANSWER queries (topic-adjacent:
# the subject appears in the corpus but the specific answer does not), so
# refusal accuracy now moves in 10% steps instead of 25%.

# ══════════════════════════════════════════════════════════════════════
